seed: 42
base_model: intfloat/multilingual-e5-base
challenger_model: BAAI/bge-m3
output_dir: ../Models/mapping-e5-v1
epochs: 3
batch_size: 16
learning_rate: 2.0e-5
warmup_ratio: 0.1
max_seq_length: 256
evaluation_top_k: [1, 3, 5]
release_gates:
  top1_accuracy: 0.85
  top3_accuracy: 0.95
  no_regression_vs_baseline: true
  security_tests_pass: true

