<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650">
  <rect width="1200" height="650" fill="#f3f6f9"/>
  <rect x="80" y="70" width="1040" height="500" rx="12" fill="#ffffff" stroke="#d5dee8"/>
  <text x="130" y="135" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">Nhập dữ liệu từ tệp Excel</text>
  <rect x="130" y="185" width="940" height="100" rx="8" fill="#fff0f0" stroke="#d64545" stroke-width="2"/>
  <circle cx="180" cy="235" r="25" fill="#d64545"/>
  <text x="180" y="244" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#ffffff">!</text>
  <text x="230" y="225" font-family="Arial" font-size="20" font-weight="700" fill="#7a1f1f">Không thể xử lý tệp</text>
  <text x="230" y="255" font-family="Arial" font-size="16" fill="#7a1f1f">Tệp rỗng hoặc không đúng định dạng. Vui lòng chọn lại tệp hợp lệ.</text>
  <rect x="130" y="335" width="940" height="110" rx="8" fill="#f7fafc" stroke="#d5dee8"/>
  <text x="165" y="375" font-family="Arial" font-size="17" fill="#17324d">Trạng thái</text>
  <text x="165" y="410" font-family="Arial" font-size="17" fill="#597086">Dữ liệu chưa được lưu và người dùng có thể chọn lại tệp.</text>
  <rect x="130" y="480" width="180" height="48" rx="7" fill="#2f80ed"/>
  <text x="220" y="511" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#ffffff">Chọn lại tệp</text>
</svg>
