</tspan><tspan x="935.0" dy="17">DocType • DataField • Template</tspan></text><rect x="825" y="235" width="220" height="75" fill="white" stroke="black" stroke-width="1.5" filter="url(#rough)"/><text x="935.0" y="264.5" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="935.0" dy="0">D3. Model Local</tspan><tspan x="935.0" dy="17">BGE-M3 fine-tuned</tspan></text><rect x="825" y="395" width="220" height="95" fill="white" stroke="black" stroke-width="1.5" filter="url(#rough)"/><text x="935.0" y="442.5" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="935.0" dy="0">P5. Validate + Build Mapping Plan</tspan></text><rect x="825" y="555" width="220" height="85" fill="white" stroke="black" stroke-width="1.5" filter="url(#rough)"/><text x="935.0" y="597.5" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="935.0" dy="0">P6. Preview / Xác nhận</tspan></text><rect x="1110" y="390" width="160" height="85" fill="white" stroke="black" stroke-width="1.5" filter="url(#rough)"/><text x="1190.0" y="424.5" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1190.0" dy="0">D4. MySQL eForm</tspan><tspan x="1190.0" dy="17">Dữ liệu chính thức</tspan></text><rect x="1110" y="570" width="160" height="75" fill="white" stroke="black" stroke-width="1.5" filter="url(#rough)"/><text x="1190.0" y="599.5" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1190.0" dy="0">D5. Mapping Feedback</tspan><tspan x="1190.0" dy="17">đã xác minh</tspan></text><path d="M 180 335 L 240 330" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="155.0" y="316.5" width="110" height="18" fill="white"/><text x="210.0" y="329.5" text-anchor="middle" font-family="Arial" font-size="10.5">F1</text><path d="M 335 375 L 335 455" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="280.0" y="399.0" width="110" height="18" fill="white"/><text x="335.0" y