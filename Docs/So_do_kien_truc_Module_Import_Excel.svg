<text x="1180.0" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Sơ đồ kiến trúc Module Import Excel thông minh</text>
<rect x="760" y="45" width="820" height="70" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1170.0" y="72.0" text-anchor="middle" font-family="Arial" font-size="11"><tspan x="1170.0" dy="0">LUỒNG CHÍNH: đi một chiều từ trái sang phải</tspan><tspan x="1170.0" dy="17">Các khối phía dưới chỉ cung cấp dữ liệu hỗ trợ.</tspan></text><rect x="30" y="250" width="190" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="125.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="125.0" dy="0">1. Người dùng</tspan><tspan x="125.0" dy="17">chọn file Excel</tspan></text><rect x="270" y="240" width="200" height="110" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="370.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="370.0" dy="0">2. Module Import Excel</tspan><tspan x="370.0" dy="17">.NET MVC / API</tspan></text><rect x="520" y="250" width="210" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="625.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="625.0" dy="0">3. Trình phân tích Excel</tspan><tspan x="625.0" dy="17">(Python / openpyxl)</tspan></text><rect x="780" y="245" width="230" height="100" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="895.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="895.0" dy="0">4. Bộ tạo ngữ cảnh</tspan><tspan x="895.0" dy="17">Header path • Mã cột • Kiểu dữ liệu</tspan></text><rect x="1060" y="240" width="230" height="110" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1175.0" y="279.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1175.0" dy="0">5. Mô hình ánh xạ AI</tspan><tspan x="1175.0" dy="17">EFormExcelMapper-v1</tspan><tspan x="1175.0" dy="17">(BGE-M3 fine-tuned)</tspan></text><rect x="1340" y="250" width="210" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1445.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1445.0" dy="0">6. Bộ kiểm tra nghiệp vụ</tspan><tspan x="1445.0" dy="17">Rule của eForm</tspan></text><rect x="1600" y="250" width="210" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1705.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1705.0" dy="0">7. Tạo dữ liệu xem trước</tspan><tspan x="1705.0" dy="17">cho Handsontable</tspan></text><rect x="1860" y="250" width="210" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1965.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1965.0" dy="0">8. Người dùng</tspan><tspan x="1965.0" dy="17">kiểm tra và xác nhận</tspan></text><rect x="2120" y="250" width="190" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="2215.0" y="287.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="2215.0" dy="0">9. Ghi dữ liệu</tspan><tspan x="2215.0" dy="17">vào eForm</tspan></text><rect x="1035" y="565" width="250" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1160.0" y="602.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1160.0" dy="0">Metadata / Schema eForm</tspan><tspan x="1160.0" dy="17">DocType • DataField • Template</tspan></text><rect x="1840" y="565" width="250" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1965.0" y="602.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="1965.0" dy="0">Dữ liệu phản hồi đã xác minh</tspan><tspan x="1965.0" dy="17">(mapping correction)</tspan></text><rect x="2100" y="565" width="230" height="90" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="2215.0" y="602.0" text-anchor="middle" font-family="Arial" font-size="13"><tspan x="2215.0" dy="0">MySQL 5.7</tspan><tspan x="2215.0" dy="17">Cơ sở dữ liệu eForm</tspan></text><rect x="1360" y="535" width="350" height="150" fill="white" stroke="black" stroke-width="1.4" filter="url(#rough)"/><text x="1535.0" y="578.0" text-anchor="middle" font-family="Arial" font-size="11"><tspan x="1535.0" dy="0">Nguyên tắc thiết kế:</tspan><tspan x="1535.0" dy="17">AI chỉ chọn DataField phù hợp.</tspan><tspan x="1535.0" dy="17">Value Excel được copy bằng code.</tspan><tspan x="1535.0" dy="17">Validation/quyền nằm ở .NET.</tspan><tspan x="1535.0" dy="17">AI không ghi trực tiếp DB.</tspan></text><path d="M 220 295 L 270 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="209.0" y="277.0" width="72" height="17" fill="white"/><text x="245.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">Tải file</text><path d="M 470 295 L 520 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="459.0" y="277.0" width="72" height="17" fill="white"/><text x="495.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">File Excel</text><path d="M 730 295 L 780 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="713.7" y="277.0" width="82.60000000000001" height="17" fill="white"/><text x="755.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">Cấu trúc Excel</text><path d="M 1010 295 L 1060 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="999.0" y="277.0" width="72" height="17" fill="white"/><text x="1035.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">Ngữ cảnh</text><path d="M 1290 295 L 1340 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="1276.65" y="277.0" width="76.7" height="17" fill="white"/><text x="1315.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">Top-K mapping</text><path d="M 1550 295 L 1600 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="1533.7" y="277.0" width="82.60000000000001" height="17" fill="white"/><text x="1575.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">Kết quả hợp lệ</text><path d="M 1810 295 L 1860 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="1799.0" y="277.0" width="72" height="17" fill="white"/><text x="1835.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">Preview</text><path d="M 2070 295 L 2120 295" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="2059.0" y="277.0" width="72" height="17" fill="white"/><text x="2095.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="10.5">Xác nhận</text><path d="M 1120 565 L 1120 430 L 1175 430 L 1175 350" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="1091.95" y="409" width="112.10000000000001" height="17" fill="white"/><text x="1148" y="421" text-anchor="middle" font-family="Arial" font-size="10.5">Candidate DataField</text><path d="M 1245 565 L 1245 465 L 1445 465 L 1445 340" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="1306.65" y="444" width="76.7" height="17" fill="white"/><text x="1345" y="456" text-anchor="middle" font-family="Arial" font-size="10.5">Schema + Rule</text><path d="M 1965 340 L 1965 565" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="1974.0" y="444" width="72" height="17" fill="white"/><text x="2010" y="456" text-anchor="middle" font-family="Arial" font-size="10.5">Correction</text><path d="M 2215 340 L 2215 565" fill="none" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" filter="url(#rough)"/><rect x="2228.7" y="444" width="82.60000000000001" height="17" fill="white"/><text x="2270" y="456" text-anchor="middle" font-family="Arial" font-size="10.5">Lưu chính thức</text></svg>