<!doctype html>
<html><head><meta charset="utf-8"><title>Trình tự</title>
<style>body { margin: 0; background: #fff; overflow: hidden; } svg text { font-family: Arial, Helvetica, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }</style></head>
<body>
<svg id="d" width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1400" height="980" fill="#fff"/>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="30" y="20" width="220" height="60" rx="6" fill="#eef3fb" stroke="#1f3864" stroke-width="2"/><text x="140" y="56">Cán bộ / Trình duyệt</text>
    <rect x="320" y="20" width="220" height="60" rx="6" fill="#fdf5e6" stroke="#8a5a00" stroke-width="2"/><text x="430" y="56">Hệ thống eForm</text>
    <rect x="610" y="20" width="240" height="60" rx="6" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/><text x="730" y="56">Dịch vụ nhập Excel</text>
    <rect x="920" y="20" width="200" height="60" rx="6" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/><text x="1020" y="56">Mô hình AI</text>
    <rect x="1170" y="20" width="200" height="60" rx="6" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/><text x="1270" y="56">Lịch sử nhập</text>
  </g>
  <g stroke="#999" stroke-dasharray="6 6" stroke-width="1.5">
    <line x1="140" y1="80" x2="140" y2="960"/><line x1="430" y1="80" x2="430" y2="960"/>
    <line x1="730" y1="80" x2="730" y2="960"/><line x1="1020" y1="80" x2="1020" y2="960"/><line x1="1270" y1="80" x2="1270" y2="960"/>
  </g>
  <g font-size="15">
    <!-- 1 -->
    <line x1="140" y1="120" x2="428" y2="120" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="112">1. Bấm "Nhập file" → hộp nhập xin mã xác thực</text>
    <line x1="430" y1="160" x2="142" y2="160" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="150" y="152">2. Mã xác thực của người đang đăng nhập (15 phút)</text>
    <!-- health -->
    <line x1="140" y1="210" x2="728" y2="210" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="202">3. Kiểm tra kết nối → trạng thái "Sẵn sàng"</text>
    <!-- parse -->
    <line x1="140" y1="270" x2="728" y2="270" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="262">4. Bấm "Nhập File Excel AI", chọn file → gửi file kèm mã (chỉ đọc, chưa lưu)</text>
    <rect x="740" y="282" width="270" height="44" fill="#fff"/>
    <text x="745" y="300">5. Kiểm tra mã: chữ ký, nơi cấp,</text>
    <text x="745" y="320">hạn dùng; sai thì từ chối</text>
    <line x1="730" y1="350" x2="1018" y2="350" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="740" y="342">6. Gửi file cho mô hình</text>
    <line x1="1020" y1="400" x2="732" y2="400" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="740" y="392">7. Vùng bảng, tiêu đề, số liệu</text>
    <line x1="730" y1="450" x2="142" y2="450" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="150" y="442">8. Kết quả đọc (vùng bảng, ô gộp, độ tin cậy, cảnh báo lệch cột)</text>
    <!-- review -->
    <rect x="40" y="480" width="560" height="150" rx="6" fill="#f6f6f6" stroke="#999"/>
    <text x="55" y="508" font-weight="bold">9. Xử lý tại trình duyệt (không gửi đi đâu)</text>
    <text x="55" y="536">• Xem trước bảng AI đọc được, sửa ô sai (ghi lại từng ô sửa)</text>
    <text x="55" y="562">• File lệch cột so với tiêu đề → dừng, yêu cầu sửa file</text>
    <text x="55" y="588">• Chọn bảng cho từng biểu, ghép vào biểu, kiểm tra như nhập thường</text>
    <text x="55" y="614">• Cán bộ bấm "Nhập dữ liệu" → "Xác nhận &amp; nhập"</text>
    <!-- save -->
    <line x1="140" y1="680" x2="728" y2="680" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="672">10. Ghi lịch sử nhập kèm mã (bảng đã ghép, các ô đã sửa)</text>
    <line x1="730" y1="720" x2="1268" y2="720" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="740" y="712">11. Lưu lịch sử (người nhập lấy từ mã)</text>
    <line x1="730" y1="760" x2="142" y2="760" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="150" y="752">12. Đã lưu (lỗi hoặc quá 10 giây vẫn không chặn việc nhập)</text>
    <!-- import -->
    <line x1="140" y1="820" x2="428" y2="820" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="812">13. Chuyển số liệu sang trang báo cáo</text>
    <rect x="440" y="840" width="400" height="70" fill="#fff"/>
    <text x="445" y="862">14. eForm ghi số liệu vào báo cáo theo luồng</text>
    <text x="445" y="886">sẵn có (kiểm tra, khóa kỳ, phân quyền) rồi</text>
    <text x="445" y="908">mở lại báo cáo cho cán bộ</text>
  </g>
</svg>
</body></html>
