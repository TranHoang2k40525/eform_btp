<!doctype html>
<html><head><meta charset="utf-8"><title>Trình tự</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  svg text { font-family: Arial, Helvetica, sans-serif; }
</style></head>
<body>
<svg id="d" width="1440" height="1010" viewBox="0 0 1440 1010" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1440" height="1010" fill="#fff"/>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="30" y="20" width="220" height="60" rx="6" fill="#eef3fb" stroke="#1f3864" stroke-width="2"/><text x="140" y="56">Cán bộ / Trình duyệt</text>
    <rect x="320" y="20" width="220" height="60" rx="6" fill="#fdf5e6" stroke="#8a5a00" stroke-width="2"/><text x="430" y="56">Hệ thống eForm</text>
    <rect x="610" y="20" width="250" height="60" rx="6" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/><text x="735" y="56">Dịch vụ nhập Excel</text>
    <rect x="930" y="20" width="210" height="60" rx="6" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/><text x="1035" y="56">Dịch vụ mô hình AI</text>
    <rect x="1190" y="20" width="210" height="60" rx="6" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/><text x="1295" y="56">Lịch sử nhập</text>
  </g>
  <g stroke="#999" stroke-dasharray="6 6" stroke-width="1.5">
    <line x1="140" y1="80" x2="140" y2="985"/><line x1="430" y1="80" x2="430" y2="985"/>
    <line x1="735" y1="80" x2="735" y2="985"/><line x1="1035" y1="80" x2="1035" y2="985"/><line x1="1295" y1="80" x2="1295" y2="985"/>
  </g>
  <g font-size="15">
    <line x1="140" y1="120" x2="428" y2="120" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="112">1. Bấm "Nhập file" → hộp nhập xin mã xác thực</text>
    <line x1="430" y1="160" x2="142" y2="160" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="150" y="152">2. Mã xác thực ngắn hạn của người đang đăng nhập (15 phút)</text>
    <line x1="140" y1="210" x2="733" y2="210" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="202">3. Kiểm tra kết nối → trạng thái "Sẵn sàng"</text>
    <line x1="140" y1="270" x2="733" y2="270" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="262">4. Bấm "Nhập File Excel AI", chọn file → gửi file kèm mã (chỉ đọc, chưa lưu)</text>
    <rect x="745" y="282" width="280" height="44" fill="#fff"/>
    <text x="750" y="300">5. Kiểm tra mã: chữ ký, nơi cấp,</text>
    <text x="750" y="320">hạn dùng; sai thì từ chối</text>
    <line x1="735" y1="350" x2="1033" y2="350" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="745" y="342">6. Chuyển file tới dịch vụ AI</text>
    <line x1="1035" y1="400" x2="737" y2="400" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="745" y="392">7. Vùng bảng, tiêu đề, vai trò cột, số liệu</text>
    <line x1="735" y1="450" x2="142" y2="450" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="150" y="442">8. Kết quả chuẩn 2.0 (nhiều bảng, gộp lặp tiêu đề, ô gộp, độ tin cậy, cảnh báo)</text>
    <rect x="40" y="478" width="600" height="174" rx="6" fill="#f6f8fc" stroke="#8a9bb5"/>
    <text x="56" y="506" font-weight="bold">9. Xử lý và kiểm soát tại trình duyệt (chưa ghi CSDL)</text>
    <text x="56" y="534">• Xem trước từng bảng AI tách được, sửa ô sai nếu cần (đếm từng ô đã sửa)</text>
    <text x="56" y="560">• Đảo cột có đủ mã thứ tự (1), (2)… → tự xếp lại đúng thứ tự và thông báo</text>
    <text x="56" y="586">• Nội dung cột lệch tiêu đề (không có mã khớp) → dừng, yêu cầu sửa file</text>
    <text x="56" y="612">• Tự chọn sẵn bảng chính cho từng biểu, ghép và kiểm tra như nhập thường</text>
    <text x="56" y="638">• Cán bộ bấm "Nhập dữ liệu" → "Xác nhận &amp; nhập"</text>
    <line x1="140" y1="704" x2="733" y2="704" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="696">10. Ghi lịch sử nhập kèm mã (bảng đã ghép, các ô đã sửa)</text>
    <line x1="735" y1="744" x2="1293" y2="744" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="745" y="736">11. Lưu lịch sử (người nhập lấy từ mã xác thực)</text>
    <line x1="735" y1="784" x2="142" y2="784" stroke="#555" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="150" y="776">12. Đã lưu lịch sử (nếu lỗi hoặc quá 10 giây vẫn không chặn việc nhập)</text>
    <line x1="140" y1="844" x2="428" y2="844" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="836">13. Chuyển số liệu sang màn hình báo cáo</text>
    <rect x="440" y="864" width="440" height="74" fill="#fff"/>
    <text x="446" y="886">14. Hệ thống eForm ghi số liệu vào báo cáo theo luồng</text>
    <text x="446" y="910">sẵn có (kiểm tra nghiệp vụ, khóa kỳ, phân quyền) rồi</text>
    <text x="446" y="934">mở lại báo cáo cho cán bộ</text>
  </g>
</svg>
</body></html>
