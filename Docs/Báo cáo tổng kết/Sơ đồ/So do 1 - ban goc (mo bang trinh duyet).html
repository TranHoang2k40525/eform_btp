<!doctype html>
<html><head><meta charset="utf-8"><title>Kiến trúc</title>
<style>
  body { margin: 0; background: #fff; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  svg text { font-family: Arial, Helvetica, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
</style></head>
<body>
<svg id="d" width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f7f7f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="40" y="40" width="1320" height="150" rx="10" fill="#eef3fb" stroke="#1f3864" stroke-width="2"/>
  <text x="60" y="72" font-size="22" font-weight="bold" fill="#1f3864">Trình duyệt của cán bộ (đã đăng nhập eForm)</text>
  <rect x="70" y="92" width="380" height="80" rx="6" fill="#fff" stroke="#1f3864"/>
  <text x="260" y="124" font-size="18" text-anchor="middle" font-weight="bold">Màn hình báo cáo eForm</text>
  <text x="260" y="152" font-size="16" text-anchor="middle">Nút "Nhập file" → mở hộp nhập</text>
  <rect x="510" y="92" width="820" height="80" rx="6" fill="#fff" stroke="#1f3864"/>
  <text x="920" y="124" font-size="18" text-anchor="middle" font-weight="bold">Hộp nhập dữ liệu Excel</text>
  <text x="920" y="152" font-size="16" text-anchor="middle">"Nhập file Excel" | "Nhập File Excel AI" → xem trước, sửa → ghép vào biểu → kiểm tra → nhập</text>
  <line x1="450" y1="132" x2="508" y2="132" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>

  <!-- eform_nq -->
  <rect x="40" y="300" width="560" height="270" rx="10" fill="#fdf5e6" stroke="#8a5a00" stroke-width="2"/>
  <text x="60" y="334" font-size="22" font-weight="bold" fill="#8a5a00">Hệ thống báo cáo eForm (đang vận hành)</text>
  <text x="60" y="360" font-size="16" fill="#333">Giữ nguyên chức năng cũ, chỉ thêm bước cấp mã xác thực</text>
  <rect x="70" y="378" width="500" height="70" rx="6" fill="#fff" stroke="#8a5a00"/>
  <text x="320" y="406" font-size="17" text-anchor="middle" font-weight="bold">Cấp mã xác thực cho người dùng</text>
  <text x="320" y="432" font-size="15" text-anchor="middle">Lấy người dùng từ phiên đăng nhập → mã có hạn 15 phút</text>
  <rect x="70" y="466" width="500" height="80" rx="6" fill="#fff" stroke="#8a5a00"/>
  <text x="320" y="494" font-size="17" text-anchor="middle" font-weight="bold">Luồng lưu báo cáo sẵn có (không đổi)</text>
  <text x="320" y="520" font-size="15" text-anchor="middle">Kiểm tra nghiệp vụ, khóa kỳ, phân quyền, ghi số liệu</text>
  <rect x="190" y="640" width="260" height="70" rx="6" fill="#fff" stroke="#8a5a00" stroke-width="2"/>
  <text x="320" y="670" font-size="17" text-anchor="middle" font-weight="bold">Cơ sở dữ liệu báo cáo</text>
  <text x="320" y="694" font-size="15" text-anchor="middle">Số liệu các biểu</text>
  <line x1="320" y1="570" x2="320" y2="638" stroke="#8a5a00" stroke-width="2" marker-end="url(#a)"/>

  <!-- eform_btp -->
  <rect x="680" y="300" width="680" height="270" rx="10" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/>
  <text x="700" y="334" font-size="22" font-weight="bold" fill="#2e6b2e">Dịch vụ nhập Excel thông minh (tách riêng)</text>
  <text x="700" y="360" font-size="16" fill="#333">Nhận file, gọi mô hình AI, ghi lịch sử nhập</text>
  <rect x="710" y="378" width="300" height="168" rx="6" fill="#fff" stroke="#2e6b2e"/>
  <text x="860" y="406" font-size="17" text-anchor="middle" font-weight="bold">Kiểm soát truy cập</text>
  <text x="860" y="434" font-size="15" text-anchor="middle">Chỉ nhận từ trang eForm</text>
  <text x="860" y="460" font-size="15" text-anchor="middle">Kiểm tra mã xác thực:</text>
  <text x="860" y="484" font-size="15" text-anchor="middle">chữ ký, nơi cấp, hạn dùng</text>
  <text x="860" y="512" font-size="15" text-anchor="middle">Sai hoặc thiếu → từ chối</text>
  <rect x="1030" y="378" width="300" height="168" rx="6" fill="#fff" stroke="#2e6b2e"/>
  <text x="1180" y="406" font-size="17" text-anchor="middle" font-weight="bold">Chức năng nhập</text>
  <text x="1180" y="436" font-size="15" text-anchor="middle">Kiểm tra trạng thái</text>
  <text x="1180" y="462" font-size="15" text-anchor="middle">Đọc file Excel</text>
  <text x="1180" y="488" font-size="15" text-anchor="middle">Ghi lịch sử nhập</text>
  <text x="1180" y="516" font-size="15" text-anchor="middle">Người dùng lấy từ mã xác thực</text>
  <line x1="1010" y1="462" x2="1028" y2="462" stroke="#2e6b2e" stroke-width="2" marker-end="url(#a)"/>

  <rect x="720" y="640" width="290" height="70" rx="6" fill="#fff" stroke="#2e6b2e" stroke-width="2"/>
  <text x="865" y="670" font-size="17" text-anchor="middle" font-weight="bold">Mô hình AI đọc bảng</text>
  <text x="865" y="694" font-size="15" text-anchor="middle">Chạy nội bộ, không truy cập CSDL</text>
  <rect x="1060" y="640" width="290" height="70" rx="6" fill="#fff" stroke="#2e6b2e" stroke-width="2"/>
  <text x="1205" y="670" font-size="17" text-anchor="middle" font-weight="bold">Cơ sở dữ liệu nhật ký</text>
  <text x="1205" y="694" font-size="15" text-anchor="middle">Lịch sử các lần nhập</text>
  <line x1="1120" y1="546" x2="900" y2="638" stroke="#2e6b2e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1200" y1="546" x2="1205" y2="638" stroke="#2e6b2e" stroke-width="2" marker-end="url(#a)"/>

  <!-- browser <-> services -->
  <line x1="200" y1="190" x2="200" y2="298" stroke="#1f3864" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="212" y="232" width="250" height="52" rx="4" fill="#fff"/>
  <text x="218" y="252" font-size="15" fill="#1f3864">① Phiên đăng nhập → nhận mã</text>
  <text x="218" y="274" font-size="15" fill="#1f3864">⑤ Lưu số liệu như nhập thường</text>
  <line x1="470" y1="190" x2="470" y2="298" stroke="#1f3864" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="980" y1="190" x2="980" y2="298" stroke="#1f3864" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="992" y="222" width="360" height="74" rx="4" fill="#fff"/>
  <text x="998" y="242" font-size="15" fill="#1f3864">② Gửi file Excel kèm mã xác thực</text>
  <text x="998" y="264" font-size="15" fill="#1f3864">③ Người dùng xem, sửa, ghép vào biểu</text>
  <text x="998" y="286" font-size="15" fill="#1f3864">④ Ghi lịch sử nhập kèm mã xác thực</text>
  <!-- shared secret -->
  <line x1="600" y1="412" x2="708" y2="412" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="654" y="400" font-size="14" text-anchor="middle" fill="#555">khóa bí mật</text>
  <text x="654" y="436" font-size="14" text-anchor="middle" fill="#555">dùng chung</text>
</svg>
</body></html>
