<!doctype html>
<html><head><meta charset="utf-8"><title>Kiến trúc</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  svg text { font-family: Arial, Helvetica, sans-serif; }
</style></head>
<body>
<svg id="d" width="1440" height="780" viewBox="0 0 1440 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f7f7f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="780" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="40" y="36" width="1360" height="156" rx="10" fill="#eef3fb" stroke="#1f3864" stroke-width="2"/>
  <text x="62" y="68" font-size="22" font-weight="bold" fill="#1f3864">Trình duyệt của cán bộ (đã đăng nhập eForm)</text>
  <rect x="70" y="88" width="380" height="84" rx="6" fill="#fff" stroke="#1f3864"/>
  <text x="260" y="122" font-size="18" text-anchor="middle" font-weight="bold">Màn hình báo cáo eForm</text>
  <text x="260" y="150" font-size="15" text-anchor="middle">Nút "Nhập file" → mở hộp nhập dữ liệu</text>
  <rect x="510" y="88" width="860" height="84" rx="6" fill="#fff" stroke="#1f3864"/>
  <text x="940" y="120" font-size="18" text-anchor="middle" font-weight="bold">Hộp nhập dữ liệu Excel</text>
  <text x="940" y="148" font-size="15" text-anchor="middle">"Nhập file Excel" | "Nhập File Excel AI" → xem trước, sửa → tự xếp cột / chọn bảng → kiểm tra → nhập</text>
  <line x1="450" y1="130" x2="508" y2="130" stroke="#1f3864" stroke-width="2" marker-end="url(#a)"/>

  <!-- eForm -->
  <rect x="40" y="304" width="560" height="270" rx="10" fill="#fdf5e6" stroke="#8a5a00" stroke-width="2"/>
  <text x="62" y="338" font-size="22" font-weight="bold" fill="#8a5a00">Hệ thống báo cáo eForm (đang vận hành)</text>
  <text x="62" y="364" font-size="15" fill="#333">Giữ nguyên luồng nghiệp vụ cũ, chỉ bổ sung bước cấp mã xác thực</text>
  <rect x="70" y="382" width="500" height="72" rx="6" fill="#fff" stroke="#8a5a00"/>
  <text x="320" y="410" font-size="17" text-anchor="middle" font-weight="bold">Cấp mã xác thực ngắn hạn</text>
  <text x="320" y="436" font-size="15" text-anchor="middle">Lấy người dùng từ phiên đăng nhập → mã ký HS256 (15 phút)</text>
  <rect x="70" y="470" width="500" height="82" rx="6" fill="#fff" stroke="#8a5a00"/>
  <text x="320" y="498" font-size="17" text-anchor="middle" font-weight="bold">Luồng lưu báo cáo sẵn có (không đổi)</text>
  <text x="320" y="524" font-size="15" text-anchor="middle">Kiểm tra công thức, khóa kỳ, phân quyền, ghi số liệu chính thức</text>
  <rect x="180" y="646" width="280" height="82" rx="6" fill="#fff" stroke="#8a5a00" stroke-width="2"/>
  <text x="320" y="680" font-size="17" text-anchor="middle" font-weight="bold">Cơ sở dữ liệu báo cáo</text>
  <text x="320" y="706" font-size="15" text-anchor="middle">Số liệu chính thức các biểu</text>
  <line x1="320" y1="574" x2="320" y2="644" stroke="#8a5a00" stroke-width="2" marker-end="url(#a)"/>

  <!-- AI Import Service -->
  <rect x="690" y="304" width="710" height="270" rx="10" fill="#eaf5ea" stroke="#2e6b2e" stroke-width="2"/>
  <text x="712" y="338" font-size="22" font-weight="bold" fill="#2e6b2e">Dịch vụ nhập Excel thông minh (tách riêng)</text>
  <text x="712" y="364" font-size="15" fill="#333">Kiểm soát truy cập, gọi dịch vụ AI, ghi lịch sử nhập</text>
  <rect x="720" y="382" width="310" height="170" rx="6" fill="#fff" stroke="#2e6b2e"/>
  <text x="875" y="410" font-size="17" text-anchor="middle" font-weight="bold">Kiểm soát truy cập</text>
  <text x="875" y="438" font-size="15" text-anchor="middle">Chỉ chấp nhận từ trang eForm</text>
  <text x="875" y="464" font-size="15" text-anchor="middle">Xác thực mã: chữ ký, nơi cấp,</text>
  <text x="875" y="488" font-size="15" text-anchor="middle">nơi nhận và thời hạn dùng</text>
  <text x="875" y="518" font-size="15" text-anchor="middle">Sai hoặc thiếu → từ chối ngay</text>
  <rect x="1060" y="382" width="310" height="170" rx="6" fill="#fff" stroke="#2e6b2e"/>
  <text x="1215" y="410" font-size="17" text-anchor="middle" font-weight="bold">Nghiệp vụ dịch vụ nhập</text>
  <text x="1215" y="440" font-size="15" text-anchor="middle">Kiểm tra trạng thái sẵn sàng</text>
  <text x="1215" y="466" font-size="15" text-anchor="middle">Kiểm tra chữ ký tệp &amp; gửi AI</text>
  <text x="1215" y="492" font-size="15" text-anchor="middle">Kiểm tra hợp đồng dữ liệu 2.0</text>
  <text x="1215" y="520" font-size="15" text-anchor="middle">Ghi lịch sử theo mã xác thực</text>
  <line x1="1030" y1="466" x2="1058" y2="466" stroke="#2e6b2e" stroke-width="2" marker-end="url(#a)"/>

  <rect x="690" y="646" width="370" height="82" rx="6" fill="#fff" stroke="#2e6b2e" stroke-width="2"/>
  <text x="875" y="676" font-size="17" text-anchor="middle" font-weight="bold">Dịch vụ AI đọc bảng Excel</text>
  <text x="875" y="700" font-size="14" text-anchor="middle">FastAPI nạp trực tiếp mô hình TorchScript (CPU)</text>
  <text x="875" y="720" font-size="13" text-anchor="middle" fill="#444">60 kênh đặc trưng · Chạy nội bộ · Không truy cập CSDL</text>

  <rect x="1100" y="646" width="300" height="82" rx="6" fill="#fff" stroke="#2e6b2e" stroke-width="2"/>
  <text x="1250" y="680" font-size="17" text-anchor="middle" font-weight="bold">Cơ sở dữ liệu nhật ký</text>
  <text x="1250" y="706" font-size="15" text-anchor="middle">Lịch sử nhập &amp; danh sách ô đã sửa</text>

  <line x1="1150" y1="552" x2="910" y2="644" stroke="#2e6b2e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1245" y1="552" x2="1250" y2="644" stroke="#2e6b2e" stroke-width="2" marker-end="url(#a)"/>

  <!-- browser <-> services -->
  <line x1="190" y1="192" x2="190" y2="302" stroke="#1f3864" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="204" y="226" width="268" height="58" rx="4" fill="#fff"/>
  <text x="210" y="248" font-size="15" fill="#1f3864">① Phiên đăng nhập → nhận mã</text>
  <text x="210" y="272" font-size="15" fill="#1f3864">⑤ Lưu số liệu như nhập thường</text>
  <line x1="490" y1="192" x2="490" y2="302" stroke="#1f3864" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="990" y1="192" x2="990" y2="302" stroke="#1f3864" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="1004" y="218" width="390" height="78" rx="4" fill="#fff"/>
  <text x="1010" y="238" font-size="15" fill="#1f3864">② Gửi file Excel kèm mã xác thực (chỉ xem trước)</text>
  <text x="1010" y="262" font-size="15" fill="#1f3864">③ Xem trước, sửa ô, tự xếp cột, ghép vào biểu</text>
  <text x="1010" y="286" font-size="15" fill="#1f3864">④ Ghi lịch sử nhập kèm mã xác thực</text>

  <!-- shared secret -->
  <line x1="600" y1="418" x2="718" y2="418" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="659" y="406" font-size="14" text-anchor="middle" fill="#555">khóa bí mật</text>
  <text x="659" y="440" font-size="14" text-anchor="middle" fill="#555">dùng chung</text>
</svg>
</body></html>
